        // Elemen DOM
        const elKelas = document.getElementById('kelas');
        const elAbsen = document.getElementById('absen');
        const elNama = document.getElementById('nama');
        const btnGenerate = document.getElementById('btn-generate');
        
        const formArea = document.getElementById('form-area');
        const resultArea = document.getElementById('result-area');
        
        const lockedNama = document.getElementById('locked-nama');
        const lockedKelas = document.getElementById('locked-kelas');
        const lockedAbsen = document.getElementById('locked-absen');
        
        const linkDisplay = document.getElementById('link-display');
        const btnOpen = document.getElementById('btn-open');
        const btnCopy = document.getElementById('btn-copy');

        const headerBg = document.getElementById('header-bg');
        const headerTitle = document.getElementById('header-title');
        const headerDesc = document.getElementById('header-desc');

        const STORAGE_KEY = 'DataTugasTIK_Siswa';

        // --- FUNGSI INISIALISASI (Cek apakah sudah pernah generate) ---
        function checkExistingData() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                const data = JSON.parse(savedData);
                lockInterface(data);
            }
        }

        // --- FUNGSI MENGUNCI TAMPILAN ---
        function lockInterface(data) {
            // Sembunyikan form input
            formArea.classList.add('hidden');
            
            // Tampilkan area hasil/terkunci
            resultArea.classList.remove('hidden');
            
            // Ubah gaya header
            headerBg.classList.replace('bg-blue-600', 'bg-gray-800');
            headerTitle.textContent = 'Link Terkunci';
            headerDesc.textContent = 'Browser ini sudah dikaitkan dengan satu identitas';

            // Isi data di UI
            lockedNama.textContent = data.namaInput;
            lockedKelas.textContent = data.kelas;
            lockedAbsen.textContent = data.absen;
            
            linkDisplay.value = data.link;
            btnOpen.href = data.link;
        }

        // --- LOGIC FORM INPUT ---
        function checkFormValidity() {
            const isKelasValid = elKelas.value !== "";
            const isAbsenValid = elAbsen.value !== "";
            const isNamaValid = elNama.value.trim() !== ""; 

            if (isKelasValid && isAbsenValid && isNamaValid) {
                btnGenerate.disabled = false;
                btnGenerate.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btnGenerate.disabled = true;
                btnGenerate.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        elKelas.addEventListener('change', (e) => {
            const kelas = e.target.value;
            elAbsen.innerHTML = '<option value="" disabled selected>-- Pilih No Absen --</option>';
            
            if (kelas && dataSiswa[kelas]) {
                dataSiswa[kelas].forEach(siswa => {
                    const opt = document.createElement('option');
                    opt.value = siswa.absen;
                    opt.textContent = `${siswa.absen}`;
                    elAbsen.appendChild(opt);
                });
                elAbsen.disabled = false;
            } else {
                elAbsen.disabled = true;
            }
            checkFormValidity();
        });

        elAbsen.addEventListener('change', checkFormValidity);
        elNama.addEventListener('input', checkFormValidity);

        // --- LOGIC TOMBOL GENERATE (MENGUNCI DATA) ---
        btnGenerate.addEventListener('click', () => {
            const kelas = elKelas.value;
            const absen = parseInt(elAbsen.value);
            const namaInput = elNama.value.trim();

            if (kelas && absen && namaInput) {
                const siswa = dataSiswa[kelas].find(s => s.absen === absen);
                if (siswa) {
                    // Buat object data untuk disimpan
                    const userData = {
                        kelas: kelas,
                        absen: absen,
                        namaInput: namaInput,
                        link: siswa.link
                    };
                    
                    // Simpan permanen di browser
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
                    
                    // Kunci tampilan
                    lockInterface(userData);
                }
            }
        });

        // --- LOGIC COPY TEXT ---
        btnCopy.addEventListener('click', () => {
            linkDisplay.select();
            document.execCommand('copy');
            btnCopy.textContent = 'Tersalin!';
            btnCopy.classList.add('bg-green-200', 'text-green-800');
            setTimeout(() => {
                btnCopy.textContent = 'Copy';
                btnCopy.classList.remove('bg-green-200', 'text-green-800');
            }, 2000);
        });

        // Jalankan pengecekan saat halaman dimuat
        checkExistingData();
    </script>
