<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Soal Praktik C++</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">Generator Soal Praktik C++</h1>
        <p class="text-gray-600 text-center mb-8">Masukkan data diri untuk mendapatkan soal praktik Anda.</p>

        <div id="inputForm" class="space-y-6">
            <div>
                <label for="namaSiswa" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                <input type="text" id="namaSiswa" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Contoh: Budi Santoso" required>
            </div>
            
            <div>
                <label for="noAbsen" class="block text-sm font-medium text-gray-700 mb-1">Nomor Absen (1-42)</label>
                <input type="number" id="noAbsen" min="1" max="42" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Contoh: 15" required>
            </div>

            <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 ease-in-out transform hover:-translate-y-1 shadow-md">
                Generate Soal
            </button>
            <p id="errorMessage" class="text-red-500 text-sm text-center hidden">Silakan isi Nama Lengkap dan Nomor Absen yang valid (1-42).</p>
        </div>

        <div id="resultArea" class="hidden mt-8">
            <div class="border-b border-gray-200 pb-4 mb-6">
                <h2 class="text-xl font-semibold text-gray-800">Soal Praktik untuk:</h2>
                <p id="displayNama" class="text-lg text-blue-600 font-medium"></p>
                <p class="text-sm text-gray-500">Nomor Absen: <span id="displayAbsen"></span></p>
            </div>

            <div class="space-y-6">
                <!-- Soal 1 -->
                <div class="bg-gray-50 p-5 rounded-lg border border-gray-200">
                    <h3 class="font-bold text-gray-800 mb-2">Soal 1: Input/Output Dasar</h3>
                    <p id="soal1" class="text-gray-700 leading-relaxed"></p>
                </div>

                <!-- Soal 2 -->
                <div class="bg-gray-50 p-5 rounded-lg border border-gray-200">
                    <h3 class="font-bold text-gray-800 mb-2">Soal 2: Operasi Aritmatika</h3>
                    <p id="soal2" class="text-gray-700 leading-relaxed"></p>
                </div>
            </div>

            <button id="resetBtn" class="mt-8 w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg transition duration-200">
                Kembali
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const generateBtn = document.getElementById('generateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const namaInput = document.getElementById('namaSiswa');
            const absenInput = document.getElementById('noAbsen');
            const errorMessage = document.getElementById('errorMessage');
            
            const inputForm = document.getElementById('inputForm');
            const resultArea = document.getElementById('resultArea');
            
            const displayNama = document.getElementById('displayNama');
            const displayAbsen = document.getElementById('displayAbsen');
            const soal1El = document.getElementById('soal1');
            const soal2El = document.getElementById('soal2');

            const variasiSapaan = [
                "halo {nama}, selamat belajar!",
                "Selamat pagi {nama}, mari kita mulai coding!",
                "Hai {nama}, semoga harimu menyenangkan!",
                "Program C++ pertama oleh {nama}.",
                "Welcome {nama} ke dunia pemrograman!",
                "Salam kenal {nama}, terus semangat belajar!",
                "Halo {nama}, bersiaplah menjadi programmer handal!"
            ];

            const variasiAritmatika = [
                "menghitung sisa kembalian dari pembelian barang. Program meminta input total harga barang dan jumlah uang yang dibayarkan, lalu menampilkan sisa kembaliannya.",
                "menghitung luas persegi panjang. Program meminta input panjang dan lebar (dalam bilangan bulat), lalu menampilkan hasil luasnya.",
                "menghitung total gaji. Program meminta input gaji pokok dan bonus (dalam bilangan bulat), lalu menampilkan total gaji keseluruhan.",
                "menghitung keliling segitiga. Program meminta input panjang dari 3 sisi segitiga, lalu menampilkan hasil kelilingnya.",
                "menghitung rata-rata dari 2 buah nilai ujian. Program meminta input nilai ujian pertama dan kedua, lalu menampilkan nilai rata-ratanya (gunakan tipe data float/double jika perlu).",
                "menghitung selisih umur. Program meminta input umur kakak dan umur adik, lalu menampilkan selisih umur mereka.",
                "menghitung harga diskon. Program meminta input harga awal (misal 100000) dan besaran diskon dalam persentase (misal 10), lalu hitung dan tampilkan harga setelah diskon (hint: diskon tetap, bukan float kompleks)."
            ];

            // Fungsi pseudo-random sederhana berbasis seed
            function pseudoRandom(seed) {
                let x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }

            // Fungsi untuk menghasilkan hash dari string nama
            function hashString(str) {
                let hash = 0;
                if (str.length === 0) return hash;
                for (let i = 0; i < str.length; i++) {
                    let char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash; // Convert to 32bit integer
                }
                return Math.abs(hash);
            }

            generateBtn.addEventListener('click', () => {
                const nama = namaInput.value.trim();
                const absen = parseInt(absenInput.value, 10);

                // Validasi Input
                if (!nama || isNaN(absen) || absen < 1 || absen > 42) {
                    errorMessage.classList.remove('hidden');
                    return;
                }
                errorMessage.classList.add('hidden');

                // Membuat seed unik dari kombinasi nama dan nomor absen
                const seed = hashString(nama.toLowerCase()) + absen;

                // Memilih variasi soal berdasarkan seed
                const indexSoal1 = Math.floor(pseudoRandom(seed) * variasiSapaan.length);
                const indexSoal2 = Math.floor(pseudoRandom(seed + 1) * variasiAritmatika.length); // +1 agar tidak selalu sama dengan soal 1

                // Mengambil nama panggilan (kata pertama)
                const namaPanggilan = nama.split(' ')[0].toUpperCase();

                // Format teks soal
                const teksSapaan = variasiSapaan[indexSoal1].replace('{nama}', namaPanggilan);
                
                const teksSoal1 = `Buatkan kode program C++ yang meminta pengguna menginputkan nama (contoh input: ${namaPanggilan}) dan menjadikan output tepat seperti berikut: <strong>"${teksSapaan}"</strong>.`;
                const teksSoal2 = `Buatkan kode program C++ yang dapat <strong>${variasiAritmatika[indexSoal2]}</strong> Pastikan program menggunakan struktur input (cin) dan output (cout) yang benar.`;

                displayNama.textContent = nama;
                displayAbsen.textContent = absen;
                soal1El.innerHTML = teksSoal1;
                soal2El.innerHTML = teksSoal2;

                // Animasi transisi antar view
                inputForm.classList.add('hidden');
                resultArea.classList.remove('hidden');
            });

            resetBtn.addEventListener('click', () => {
                inputForm.classList.remove('hidden');
                resultArea.classList.add('hidden');
                namaInput.value = '';
                absenInput.value = '';
                namaInput.focus();
            });
            
            // Allow Enter key to trigger generation
            inputForm.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    generateBtn.click();
                }
            });
        });
    </script>
</body>
</html>
